name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: $bin-x86_64-linux-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: $bin-aarch64-linux-static
          - target: universal-apple-darwin
            os: macos-latest
            archive: $bin-universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/upload-rust-binary-action@v1
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_STRIP: symbols
        with:
          bin: teamtypev
          include: README.md,LICENSE.md
          archive: ${{ matrix.archive }}
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-editor-assets:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json
      - name: Package editor plugins
        run: |
          tar -czf teamtypev-nvim.tar.gz -C nvim-plugin .
          cd vscode-plugin
          npm ci
          npx --yes @vscode/vsce@3.6.2 package --out ../teamtypev.vsix
      - name: Upload editor plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" teamtypev-nvim.tar.gz emacs-plugin/teamtypev.el teamtypev.vsix --clobber
