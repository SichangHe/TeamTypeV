name: Nightly

permissions:
  contents: write

on:
  push:
    branches:
      - live-multi-editor
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Built into a release of its own, so that the nightly release keeps its assets until the
      # new ones are ready.
      - name: Create a release for this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-$GITHUB_RUN_ID" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build $GITHUB_RUN_ID" --notes "Built from $GITHUB_SHA."

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: $bin-x86_64-linux-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: $bin-aarch64-linux-static
          - target: universal-apple-darwin
            os: macos-latest
            archive: $bin-universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/upload-rust-binary-action@v1
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_STRIP: symbols
        with:
          bin: teamtype
          include: README.md,LICENSE.md
          archive: ${{ matrix.archive }}
          target: ${{ matrix.target }}
          ref: refs/tags/build-${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Move the assets to the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build="build-$GITHUB_RUN_ID"
          mkdir assets
          gh release download "$build" --dir assets
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --target "$GITHUB_SHA" \
              --title "Nightly ($GITHUB_REF_NAME)" --notes "Built from $GITHUB_SHA."
          fi
          gh release upload nightly assets/* --clobber
          git push --force origin "$GITHUB_SHA:refs/tags/nightly"
          gh release edit nightly --notes "Built from $GITHUB_SHA."
          gh release delete "$build" --cleanup-tag --yes
