name: Neovim plugin

on:
  push:
    branches:
      - 'main'
    paths:
      - 'nvim-plugin/**'
      - '.github/workflows/nvim-plugin.yml'
  pull_request:
    paths:
      - 'nvim-plugin/**'
      - '.github/workflows/nvim-plugin.yml'

jobs:
  check_lua:
    name: Check Lua formatting and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.20.0
          args: --config-path nvim-plugin/.stylua.toml --check nvim-plugin
      - name: Luacheck Linting
        uses: lunarmodules/luacheck@v1
        with:
          args: --config nvim-plugin/.luacheckrc nvim-plugin

  test_lua:
    name: Test editor protocol logic (Neovim ${{ matrix.nvim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [v0.9.5, v0.10.4, v0.11.7, v0.12.2]
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - name: Run headless tests
        working-directory: nvim-plugin
        run: nvim --headless -u NONE -l test/run.lua
